name: ci

# 版の正は docker-compose.yml の image の 1 行。README の見本がそこからずれたら落とす。
# verify.sh は Apple Container を要るのでここでは走らせない (版を上げるときに手で回す)。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: README の見本の版が compose と同じ
        run: sh scripts/check-pin.sh README.md
      # 消費者に配っている検査を、この repo 自身にも当てる。ここの docs は endpoint の
      # 見本を書くので、repo ごとの store の名前がいちばん戻りやすい。
      - name: store の名前は共有のものだけ
        run: sh scripts/check-store-name.sh crawler-storage
      - name: shell の構文
        run: |
          for f in scripts/*.sh etc/*.sh; do
            sh -n "$f"
          done
