# SeaweedFS を単体で立てるための compose。
#
# **これが原本**。消費者 (browserhive / capture-ledger / wacz-validator) はこの service
# ブロックを写して使う —— container-compose は include: も extends: も使えないので、
# 共有する手段が無い。写しの image の版がこことずれると、各消費者の check が
# scripts/check-pin.sh で落とす。
#
#   container-compose up -d          # 立てる
#   container-compose down           # 畳む
#
# 設定は env だけで決まる (etc/entrypoint.sh の冒頭を参照)。ここは既定の見本で、
# 消費者はそれぞれの bucket 名と、必要なら S3_ANONYMOUS_READ を渡す。
name: seaweedfs

services:
  seaweedfs:
    # 版を上げるときは scripts/verify.sh を回してから (頼っている挙動を実物で確かめる)。
    # 4.27 未満に戻さないこと: 空にしたバケットが再起動で書けなくなる (上流 #9563)。
    image: docker.io/chrislusf/seaweedfs:4.46
    # entrypoint が bucket 作成も兼ねる (背後でリトライし続ける) —— 順番を面倒みる
    # べき使い捨ての init コンテナは、別に存在しない。
    entrypoint: ["/etc/seaweedfs/entrypoint.sh"]
    environment:
      - S3_ACCESS_KEY_ID=seaweedfs
      - S3_SECRET_ACCESS_KEY=seaweedfs
      - S3_BUCKET=seaweedfs
    # 8333 が S3 API、8888 が filer の UI。host 側の道具のために publish する。
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8888:8888"
    volumes:
      # read-only で mount する。設定は /tmp に書き出されるので、これで足りる。
      - ./etc:/etc/seaweedfs:ro
      - seaweedfs-data:/data

volumes:
  seaweedfs-data:
